<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="Working stack"><title>Working stack</title><style>text{font-family:Arial,Helvetica,sans-serif}.m{font-family:Menlo,Consolas,monospace}.reveal{animation:reveal 12s ease infinite}.sweep{animation:sweep 12s linear infinite}@keyframes reveal{0%,5%{opacity:.2}25%,100%{opacity:1}}@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(850px)}}@media(prefers-reduced-motion:reduce){.reveal,.sweep{animation:none}.sweep{display:none}}</style><rect width="1000" height="110" fill="#101315"/><path d="M32 0H968" stroke="#303637"/><text x="32" y="35" fill="#89918e" font-size="10" font-weight="400" class="m" letter-spacing="1">METHODS / TOOLCHAIN</text><text x="32" y="78" fill="#e6e7e3" font-size="27" font-weight="400" letter-spacing="-.6">Python   C++   ROS   Linux</text><text x="604" y="77" fill="#89918e" font-size="12" font-weight="400" >OpenCV / PyTorch / Vue / Electron</text></svg>