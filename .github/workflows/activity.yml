name: Refresh contribution artwork
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch public contributions and render
        env:
          PROFILE_USER: ${{ github.repository_owner }}
        run: |
          python3 scripts/update_activity.py
          python3 scripts/render_activity.py
      - name: Commit refreshed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg assets/activity-light.svg contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public contribution artwork'
            git push
          fi
